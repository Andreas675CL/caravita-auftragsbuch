/* Layout: sticky Kopfleiste mit Ansichten, darunter Kennzahlenleiste (Zusammenfassung), Filter, dann Board / Liste / Controlling. */
/* Layout: CaraVita-Kopf mit Logo und Ansichten, darunter Kennzahlen (Zusammenfassung), Filter, dann Board / Liste / Controlling. Farben und Schriften von caravita-gmbh.de */
:root{
  --bg:#f4f6ee; --surface:#ffffff; --surface-2:#e9edde; --line:#dbe0cb; --fg:#1a1a1a; --muted:#5a5a5a;
  --brand:#8cb82b; --accent:#5c7c1a; --accent-ink:#ffffff; --accent-soft:#eef3df;
  --st-eingang:#878c7c; --st-in_arbeit:#2f6f9f; --st-wartend:#c0850f; --st-erledigt:#5c7c1a; --st-storniert:#a5a99c;
  --crit:#c0392b; --crit-soft:#fbe8e5; --warn:#b26b0b; --warn-soft:#fbf0dc; --ok:#5c7c1a; --ok-soft:#eef3df;
  --shadow:0 1px 2px rgba(40,50,20,.06),0 4px 14px rgba(40,50,20,.06);
  --f-body:"Mulish","Muli",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121410; --surface:#1a1d16; --surface-2:#22261c; --line:#30362a; --fg:#ecefe6; --muted:#a3a99a;
  --brand:#8cb82b; --accent:#a8d445; --accent-ink:#121410; --accent-soft:#26301a;
  --st-eingang:#a3a99a; --st-in_arbeit:#72aedc; --st-wartend:#e3a443; --st-erledigt:#a8d445; --st-storniert:#6b7064;
  --crit:#ff7466; --crit-soft:#3a1d1a; --warn:#eda54a; --warn-soft:#38291a; --ok:#a8d445; --ok-soft:#26301a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121410; --surface:#1a1d16; --surface-2:#22261c; --line:#30362a; --fg:#ecefe6; --muted:#a3a99a;
  --brand:#8cb82b; --accent:#a8d445; --accent-ink:#121410; --accent-soft:#26301a;
  --st-eingang:#a3a99a; --st-in_arbeit:#72aedc; --st-wartend:#e3a443; --st-erledigt:#a8d445; --st-storniert:#6b7064;
  --crit:#ff7466; --crit-soft:#3a1d1a; --warn:#eda54a; --warn-soft:#38291a; --ok:#a8d445; --ok-soft:#26301a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--brand)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand .sep{width:1px;height:28px;background:var(--line)}
.brand .nm{display:grid;line-height:1.15}
.brand h1{font-family:var(--f-head);font-weight:500;font-size:21px;margin:0}
.brand span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:999px}
.tabs a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.inline-act{display:flex;gap:6px;align-items:center}
.inline-act .field{flex:1}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;text-decoration:underline}

main{padding-block:18px 48px;display:grid;gap:18px}

/* Hinweise */
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--accent-soft);font-size:13px}
.notice.warn{background:var(--warn-soft)}
.notice .grow{flex:1;min-width:200px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (min-width:1240px){.kpis{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .val{font-size:23px}.top{position:static}}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px;align-content:start}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.kpi .val{font-family:var(--f-body);font-size:27px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi .val.crit{color:var(--crit)} .kpi .val.ok{color:var(--ok)} .kpi .val.warn{color:var(--warn)}
.scope-note{font-size:12px;color:var(--muted);margin-top:-10px}

/* Filter */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0}
.field{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0}
select.field{padding-right:28px}
.filters .reset{color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.board{grid-template-columns:1fr}}
.col{background:var(--surface-2);border-radius:10px;padding:10px;display:grid;gap:8px;min-height:120px;align-content:start}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.col-h h2{font-family:var(--f-head);font-size:16px;font-weight:500;margin:0}
.col-h .cnt{font-size:12px;color:var(--muted);margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:grid;gap:6px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card[draggable=true]{cursor:grab}
.card .r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .nr{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.card .t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.card .foot{display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap}
.col .more{font-size:12px;color:var(--muted);padding:2px 4px}
.col .empty{font-size:12.5px;color:var(--muted);padding:10px 4px;text-align:center}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.p-dringend{background:var(--crit-soft);color:var(--crit)}
.chip.p-hoch{background:var(--warn-soft);color:var(--warn)}
.chip.over{background:var(--crit);color:var(--surface)}
.chip.ex{border:1px dashed var(--muted);background:none}
.chip.st{background:none;color:var(--fg);padding-left:0}
.chip.st .dot{width:8px;height:8px}
.due-over{color:var(--crit);font-weight:600}
.due-soon{color:var(--warn);font-weight:600}

/* Tabelle */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--surface);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th .arr{opacity:.7}
td.r,th.r{text-align:right}
td.title{white-space:normal;min-width:220px;font-weight:500}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:none}
.tbl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.tbl-head .muted{color:var(--muted);font-size:12.5px}

/* Controlling */
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.ctrl{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0;align-content:start}
.panel.wide{grid-column:1/-1}
.panel h3{font-family:var(--f-head);font-size:18px;font-weight:500;margin:0}
.panel .desc{font-size:12.5px;color:var(--muted);margin:-6px 0 0;max-width:70ch}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .b-in{fill:var(--st-eingang)}
svg.chart .b-out{fill:var(--st-erledigt)}
svg.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
svg.chart .pt{fill:var(--accent)}
svg.chart text.v{fill:var(--fg);font-weight:600}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.hbar .seg{height:100%;background:var(--c)}
.hbar .v{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:right}
.mini-empty{color:var(--muted);font-size:13px;padding:10px 0}

/* Leerzustand */
.emptystate{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;display:grid;gap:8px;justify-items:center}
.emptystate h2{font-family:var(--f-head);font-weight:500;margin:0;font-size:21px}
.emptystate p{margin:0;color:var(--muted);max-width:52ch}

/* Detail-Panel */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-h h2{font-family:var(--f-head);font-weight:500;font-size:20px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:16px;align-content:start}
.dr-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.dr-f .sp{flex:1}
.x{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.form .field{color:var(--fg);font-size:14px;width:100%}
textarea.field{min-height:76px;resize:vertical}
@media (max-width:460px){.form{grid-template-columns:1fr}}
@media (pointer:coarse){.field,.form .field{font-size:16px}}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.seg-status{display:flex;flex-wrap:wrap;gap:6px}
.seg-status button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px}
.seg-status button[aria-pressed="true"]{border-color:var(--c);background:var(--surface-2);font-weight:600}
.sec-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.facts div{background:var(--surface);padding:8px 10px;display:grid;gap:1px}
.facts dt{font-size:11.5px;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:10px;position:relative}
.timeline li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{margin-top:4px;width:12px;height:12px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--c)}
.timeline .w{font-size:12px;color:var(--muted)}
.timeline .n{font-size:13px;overflow-wrap:anywhere}
.err{color:var(--crit);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{font-size:14px;min-height:100vh}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mailrow{display:flex;gap:8px;align-items:center}
.mailrow .field{flex:1}
.mailrow a{white-space:nowrap;font-size:13px;color:var(--accent);font-weight:700}
/* Direkt antworten */
.reply{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:10px 12px;display:grid;gap:10px;background:var(--accent-soft)}
.reply-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.reply-h b{overflow-wrap:anywhere}
.reply-p{display:grid;gap:8px}
.reply-p textarea{min-height:110px;width:100%}
.tpl{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.reply-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.reply-n{margin:0;font-size:12px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Anmeldung */
.login{max-width:420px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:14px;padding:24px;display:grid;gap:14px}
.login h2{font-family:var(--f-head);font-weight:500;font-size:24px;margin:0}
.login p{margin:0;color:var(--muted)}
.login label{display:grid;gap:6px;font-weight:700}
.login .field{font-size:16px;padding:10px 12px;border-radius:10px;width:100%}
.login .btn{justify-content:center;padding:11px 18px;font-size:15px}
.setup{background:var(--warn-soft);border-radius:10px;padding:12px 14px}
.setup code{font-family:var(--f-mono)}
/* Passwort ändern */
.pwbox{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,14,8,.5)}
.pwbox .login{margin:0;width:min(420px,100%)}
.pwbox .hint{font-size:12.5px;color:var(--muted);margin:-6px 0 0}
.pwbox .row2{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.who{flex-wrap:wrap;justify-content:flex-end}
.pwbox .login{max-height:calc(100vh - 32px);overflow:auto}
.pwbox .login.wide{width:min(560px,100%)}
.login label.chk{display:flex;font-weight:400}
.tlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tlist li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.tlist .tn{flex:1;min-width:160px}
.tlist .tn b{display:block}
.tlist .tn span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tlist li.off .tn{opacity:.55}
.tadd{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:end}
.tadd label{font-size:13px}
.tadd .field{font-size:15px;padding:8px 10px}

<script>
(function(){
"use strict";
// ---------- Konstanten ----------
const ST = {
  eingang:{l:"Eingang"}, in_arbeit:{l:"In Bearbeitung"}, wartend:{l:"Wartet"}, erledigt:{l:"Erledigt"}, storniert:{l:"Storniert"}
};
const OPEN = ["eingang","in_arbeit","wartend"];
const PRIO = {dringend:{l:"Dringend",o:0},hoch:{l:"Hoch",o:1},normal:{l:"Normal",o:2},niedrig:{l:"Niedrig",o:3}};
const DEFAULT_CATS = ["Kundenauftrag","Angebot","Reparatur / Service","Reklamation","Verwaltung","Abrechnung","Geräte & Wartung","Einkauf / Material","Intern"];
const DEFAULT_STANDORTE = ["Dudweiler","Ostspange","Weisdorffstraße","Riegelsberg"];
const DAY = 864e5, HOUR = 36e5;
const NEXT = {eingang:"in_arbeit", in_arbeit:"erledigt", wartend:"in_arbeit"};
const NEXT_L = {eingang:"Starten", in_arbeit:"Fertigmelden", wartend:"Fortsetzen"};

// ---------- Zustand ----------
const S = {
  tickets: [], loaded:false, sb:null, canWrite:true, downloads:true,
  user:null, me:{id:null,name:"",mailNeu:true}, names:{}, team:[],
  view:"board", sort:{k:"eingang",d:"desc"},
  f:{q:"",person:"",cat:"",prio:"",standort:"",status:"offen",mine:false},
  open:null, // {id|null, dirty}
};

// ---------- Hilfen ----------
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ts = v => v ? new Date(v).getTime() : NaN;
const nowMs = () => Date.now();
const nf1 = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1,minimumFractionDigits:1});
const nf0 = new Intl.NumberFormat("de-DE",{maximumFractionDigits:0});
const eur = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const dfmt = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
const dtfmt = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
const fDate = v => v ? dfmt.format(new Date(v)) : "–";
const fDT = v => v ? dtfmt.format(new Date(v)) : "–";
function fDur(ms){
  if(!isFinite(ms)||ms<0) return "–";
  if(ms < HOUR) return nf0.format(Math.max(1,Math.round(ms/6e4)))+" Min";
  if(ms < DAY) return nf1.format(ms/HOUR)+" Std";
  return nf1.format(ms/DAY)+" Tage";
}
const fDays = d => isFinite(d) ? nf1.format(d)+" T" : "–";
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : NaN;
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
function dueEnd(t){ if(!t.faellig) return NaN; const d=new Date(t.faellig+"T23:59:59"); return d.getTime(); }
function isOverdue(t){ return OPEN.includes(t.status) && isFinite(dueEnd(t)) && dueEnd(t) < nowMs(); }
function dueSoon(t){ const e=dueEnd(t); return OPEN.includes(t.status) && isFinite(e) && e>=nowMs() && e-nowMs() < 2*DAY; }
function startOf(t){ return ts(t.start); }
function doneOf(t){ return ts(t.erledigt); }
function leadTime(t){ return doneOf(t)-ts(t.eingang); }           // Durchlaufzeit
function reactTime(t){ const s=startOf(t); return isFinite(s)? s-ts(t.eingang) : NaN; } // Reaktionszeit
function workTime(t){ const s=startOf(t); return isFinite(s)&&isFinite(doneOf(t))? doneOf(t)-s : NaN; } // Bearbeitungsdauer
function ageOf(t){ return nowMs()-ts(t.eingang); }
function statusSince(t){ const v=(t.verlauf||[]); const last=v.length? v[v.length-1].ts : t.eingang; return nowMs()-ts(last); }
function phaseTimes(t){
  const v=(t.verlauf||[]).slice().sort((a,b)=>ts(a.ts)-ts(b.ts));
  const out={eingang:0,in_arbeit:0,wartend:0};
  for(let i=0;i<v.length;i++){
    const s=v[i].status; if(!(s in out)) continue;
    const end = i+1<v.length ? ts(v[i+1].ts) : nowMs();
    out[s]+=Math.max(0,end-ts(v[i].ts));
  }
  return out;
}
function onTime(t){ const e=dueEnd(t); if(!isFinite(e)||!isFinite(doneOf(t))) return null; return doneOf(t)<=e; }
function isoWeek(d){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return Math.ceil(((x-y0)/DAY+1)/7);
}
function mondayOf(ms){ const d=new Date(ms); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); }
function initials(n){ return String(n||"").split(/\s+/).filter(Boolean).map(s=>s[0]).slice(0,2).join("").toUpperCase(); }
function toast(msg){

  clearTimeout(toast._t); toast._t=setTimeout(()=>{r.innerHTML=""},2600);

function stChip(st){ return '<span class="chip st"><span class="dot" '+dotStyle(st)+'></span>'+esc(ST[st]?ST[st].l:st)+'</span>'; }

// ---------- Filter ----------
function filtered(ignoreStatus){
  const f=S.f, q=f.q.trim().toLowerCase();
  return S.tickets.filter(t=>{
    if(f.mine && !isMine(t)) return false;
    if(f.standort && (t.standort||"")!==f.standort) return false;
    if(f.person && (t.verantwortlich||"")!==f.person) return false;
    if(f.cat && (t.kategorie||"")!==f.cat) return false;
    if(f.prio && (t.prioritaet||"normal")!==f.prio) return false;
    if(!ignoreStatus){
      if(f.status==="offen" && !OPEN.includes(t.status)) return false;
      if(f.status!=="offen" && f.status!=="alle" && t.status!==f.status) return false;
    }
    if(q){ const hay=[t.nr,t.titel,t.email,t.kunde,t.standort,t.kategorie,t.verantwortlich,t.beschreibung].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function filterActive(){ const f=S.f; return !!(f.q||f.person||f.cat||f.prio||f.standort||f.mine); }

// ---------- KPIs ----------
function kpiData(list){
  const n=nowMs();
  const open=list.filter(t=>OPEN.includes(t.status));
  const over=open.filter(isOverdue);
  const done=list.filter(t=>t.status==="erledigt"&&isFinite(doneOf(t)));
  const d30=done.filter(t=>doneOf(t)>=n-30*DAY);
  const dPrev=done.filter(t=>doneOf(t)<n-30*DAY&&doneOf(t)>=n-60*DAY);
  const d90=done.filter(t=>doneOf(t)>=n-90*DAY);
  const in30=list.filter(t=>ts(t.eingang)>=n-30*DAY);
  const lead=avg(d90.map(leadTime).filter(isFinite))/DAY;
  const react=avg(list.filter(t=>ts(t.eingang)>=n-90*DAY).map(reactTime).filter(isFinite));
  const work=avg(d90.map(workTime).filter(isFinite));
  const ot=d90.map(onTime).filter(v=>v!==null);
  const otRate=ot.length? ot.filter(Boolean).length/ot.length : NaN;
  const effList=d90.filter(t=>+t.planStd>0&&+t.istStd>0);
  const plan=sum(effList.map(t=>t.planStd)), ist=sum(effList.map(t=>t.istStd));
  return {
    open:open.length, inWork:list.filter(t=>t.status==="in_arbeit").length, waiting:list.filter(t=>t.status==="wartend").length,
    over:over.length, done30:d30.length, donePrev:dPrev.length, in30:in30.length,
    lead, react, work, otRate, otN:ot.length, plan, ist, effN:effList.length,
    valOpen:sum(open.map(t=>t.wert)), val30:sum(d30.map(t=>t.wert)),
  };
}
function renderKpis(){
  const k=kpiData(filtered(true));
  const diff=k.done30-k.donePrev;
  const dev = k.plan>0 ? (k.ist-k.plan)/k.plan : NaN;
  const cells=[
    {l:"Offene Aufträge",v:nf0.format(k.open),s:k.inWork+" in Bearbeitung · "+k.waiting+" wartend"},
    {l:"Überfällig",v:nf0.format(k.over),c:k.over?"crit":"ok",s:k.open? nf0.format(k.over/k.open*100)+" % der offenen":"keine offenen"},
    {l:"Erledigt 30 Tage",v:nf0.format(k.done30),s:k.in30+" neu eingegangen · "+(diff>=0?"+":"")+diff+" ggü. Vormonat"},
    {l:"Ø Durchlaufzeit",v:isFinite(k.lead)?nf1.format(k.lead)+" T":"–",s:"Eingang → Fertig, 90 Tage"},
    {l:"Ø Reaktionszeit",v:fDur(k.react),s:"Ø Bearbeitung "+fDur(k.work)},
    {l:"Termintreue",v:isFinite(k.otRate)?nf0.format(k.otRate*100)+" %":"–",c:!isFinite(k.otRate)?"":k.otRate>=.9?"ok":k.otRate>=.75?"warn":"crit",s:k.otN+" Aufträge mit Termin, 90 T"},
    {l:"Aufwand Ist / Plan",v:isFinite(dev)?(dev>=0?"+":"")+nf0.format(dev*100)+" %":"–",c:!isFinite(dev)?"":Math.abs(dev)<=.1?"ok":dev>0?"warn":"ok",s:isFinite(dev)?nf0.format(k.ist)+" / "+nf0.format(k.plan)+" Std, 90 T":"keine Stunden erfasst"},
    {l:"Auftragswert offen",v:eur.format(k.valOpen),s:"erledigt 30 T: "+eur.format(k.val30)},
  ];
  $("#kpis").innerHTML=cells.map(c=>'<div class="kpi"><div class="lbl">'+esc(c.l)+'</div><div class="val '+(c.c||"")+'">'+esc(c.v)+'</div><div class="sub">'+esc(c.s)+'</div></div>').join("");
  const sn=$("#scopeNote");
  if(filterActive()){ sn.hidden=false; sn.textContent="Kennzahlen gelten für die aktuelle Filterauswahl."; } else sn.hidden=true;
}

    '<div class="foot"><span class="meta">'+esc(timeInfo)+'</span>'+(canNext?'<button class="btn small" type="button" data-next="'+esc(t.id)+'">'+NEXT_L[t.status]+' →</button>':'')+'</div>'+
  '</article>';

function sortBoard(a,b){
  const pa=PRIO[a.prioritaet||"normal"].o, pb=PRIO[b.prioritaet||"normal"].o;
  const oa=isOverdue(a)?0:1, ob=isOverdue(b)?0:1;
  if(oa!==ob) return oa-ob; if(pa!==pb) return pa-pb;
  const da=dueEnd(a), dbb=dueEnd(b);
  if(isFinite(da)||isFinite(dbb)) return (isFinite(da)?da:Infinity)-(isFinite(dbb)?dbb:Infinity);
  return ts(a.eingang)-ts(b.eingang);
}
function renderBoard(){
  const list=filtered(true);

    if(st==="erledigt"){

// ---------- Controlling ----------
function chartFlow(list){
  const W=1000,H=260,L=34,R=10,T=20,B=34;
  const n=nowMs(), m0=mondayOf(n)-11*7*DAY;
  const weeks=[];
  for(let i=0;i<12;i++){ const s=m0+i*7*DAY; weeks.push({s,e:s+7*DAY,kw:isoWeek(new Date(s)),inn:0,out:0}); }
  list.forEach(t=>{
    const e=ts(t.eingang), d=doneOf(t);
    weeks.forEach(w=>{ if(e>=w.s&&e<w.e) w.inn++; if(t.status==="erledigt"&&d>=w.s&&d<w.e) w.out++; });
  });
  // offener Bestand am Wochenende
  weeks.forEach(w=>{ w.bestand=list.filter(t=>ts(t.eingang)<w.e && t.status!=="storniert" && !(t.status==="erledigt"&&doneOf(t)<w.e)).length; });
  const maxV=Math.max(1,...weeks.map(w=>Math.max(w.inn,w.out,w.bestand)));
  const step=maxV<=5?1:maxV<=10?2:maxV<=25?5:maxV<=50?10:Math.ceil(maxV/50)*10;
  const top=Math.ceil(maxV/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top);
  const bw=(W-L-R)/12;
  let g="";
  for(let v=0;v<=top;v+=step){ g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'; }
  let bars="", pts=[];
  weeks.forEach((w,i)=>{
    const x0=L+i*bw, b=Math.min(14,bw*0.3), gap=2, cx=x0+bw/2;
    bars+='<rect class="b-in" x="'+(cx-b-gap/2)+'" y="'+y(w.inn)+'" width="'+b+'" height="'+(y(0)-y(w.inn))+'" rx="1.5"><title>KW '+w.kw+': '+w.inn+' Eingänge</title></rect>';
    bars+='<rect class="b-out" x="'+(cx+gap/2)+'" y="'+y(w.out)+'" width="'+b+'" height="'+(y(0)-y(w.out))+'" rx="1.5"><title>KW '+w.kw+': '+w.out+' erledigt</title></rect>';
    bars+='<text x="'+cx+'" y="'+(H-B+16)+'" text-anchor="middle">'+w.kw+'</text>';
    pts.push([cx,y(w.bestand),w]);
  });
  const path='<path class="ln" d="M'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L")+'"/>'+
    pts.map((p,i)=>'<circle class="pt" cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===11?4:2.5)+'"><title>Ende KW '+p[2].kw+': '+p[2].bestand+' offen</title></circle>').join("")+
    '<text class="v" x="'+(pts[11][0]-8)+'" y="'+(pts[11][1]-8)+'" text-anchor="end">'+pts[11][2].bestand+' offen</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Eingang und Erledigung pro Kalenderwoche">'+g+bars+path+
    '<text x="'+((W+L)/2)+'" y="'+(H-2)+'" text-anchor="middle">Kalenderwoche</text></svg>';
}
function phaseBars(list){
  const n=nowMs();
  const done=list.filter(t=>t.status==="erledigt"&&doneOf(t)>=n-180*DAY);
  const groups={};
  done.forEach(t=>{ const k=t.kategorie||"Ohne Kategorie"; (groups[k]=groups[k]||[]).push(phaseTimes(t)); });
  const rows=Object.keys(groups).map(k=>{ const a=groups[k]; return {k,n:a.length,e:avg(a.map(p=>p.eingang))/DAY,w:avg(a.map(p=>p.in_arbeit))/DAY,p:avg(a.map(p=>p.wartend))/DAY}; });
  if(!rows.length) return '<div class="mini-empty">Noch keine erledigten Aufträge in den letzten 180 Tagen.</div>';
  rows.sort((a,b)=>(b.e+b.w+b.p)-(a.e+a.w+a.p));
  const mx=Math.max(...rows.map(r=>r.e+r.w+r.p))||1;
  return '<div class="hbars">'+rows.map(r=>{
    const seg=(v,st,l)=>'<div class="seg" style="--c:var(--st-'+st+');width:'+(v/mx*100).toFixed(2)+'%" title="'+l+': '+nf1.format(v)+' Tage"></div>';
    return '<div class="hbar"><span class="nm" title="'+esc(r.k)+'">'+esc(r.k)+' <span style="color:var(--muted)">('+r.n+')</span></span><div class="track">'+seg(r.e,"eingang","Warten auf Start")+seg(r.w,"in_arbeit","In Bearbeitung")+seg(r.p,"wartend","Wartet")+'</div><span class="v">'+nf1.format(r.e+r.w+r.p)+' T</span></div>';
  }).join("")+'</div>';
}
function ageBars(list){
  const open=list.filter(t=>OPEN.includes(t.status));
  if(!open.length) return '<div class="mini-empty">Keine offenen Aufträge.</div>';
  const b=[{l:"0–2 Tage",a:0,z:2},{l:"3–7 Tage",a:2,z:7},{l:"8–14 Tage",a:7,z:14},{l:"15–30 Tage",a:14,z:30},{l:"über 30 Tage",a:30,z:Infinity}];
  b.forEach(x=>{ x.n=open.filter(t=>{const d=ageOf(t)/DAY; return d>=x.a&&d<x.z || (x.a===0&&d<0);}).length; });
  const mx=Math.max(1,...b.map(x=>x.n));
  const colr=["eingang","eingang","wartend","wartend","storniert"];
  return '<div class="hbars">'+b.map((x,i)=>'<div class="hbar"><span class="nm">'+x.l+'</span><div class="track"><div class="seg" style="--c:'+(i>=3?"var(--crit)":i===2?"var(--warn)":"var(--st-in_arbeit)")+';width:'+(x.n/mx*100).toFixed(2)+'%"></div></div><span class="v">'+x.n+'</span></div>').join("")+'</div>';
}
function groupTable(list,keyFn,label){

  };
  return '<div class="tbl-wrap"><table><thead><tr><th>'+label+'</th><th class="r">Offen</th><th class="r">In Arbeit</th><th class="r">Überfällig</th><th class="r">Erledigt 30 T</th><th class="r">Ø Durchlauf 90 T</th><th class="r">Termintreue</th><th class="r">Std Ist / Plan</th><th class="r">Umsatz 30 T</th></tr></thead><tbody style="cursor:default">'+
    keys.map(k=>row(k,g[k])).join("")+'</tbody></table></div>';
}
function renderControlling(){

  return '<div class="ctrl">'+
    '<section class="panel wide"><h3>Eingang, Erledigung und offener Bestand</h3><p class="desc">Neue und erledigte Aufträge pro Kalenderwoche der letzten 12 Wochen. Die Linie zeigt, wie viele Aufträge am Ende der Woche offen waren. Liegt Eingang dauerhaft über Erledigung, wächst der Rückstau.</p>'+

// ---------- Schreiben ----------
function nextNr(dateMs){
  const y=new Date(dateMs).getFullYear();
  let mx=0; S.tickets.forEach(t=>{ const m=/^A-(\d{4})-(\d+)$/.exec(t.nr||""); if(m&&+m[1]===y) mx=Math.max(mx,+m[2]); });
  return "A-"+y+"-"+String(mx+1).padStart(4,"0");
}
function applyStatus(t,st,notiz){
  const iso=new Date().toISOString();
  const patch=Object.assign({status:st, verlauf:[...(t.verlauf||[]),{ts:iso,status:st,notiz:notiz||"",von:S.me.id||null}]},stamp());
  if(st==="in_arbeit" && !t.start) patch.start=iso;
  if(st==="erledigt"){ patch.erledigt=iso; if(!t.start) patch.start=iso; }
  if(st!=="erledigt" && t.erledigt) patch.erledigt=null;
  return patch;
}
// ---------- Datenbank-Zuordnung ----------
const MAP={planStd:"plan_std",istStd:"ist_std",geaendertAm:"geaendert_am",geaendertVon:"geaendert_von",verantwortlichEmail:"verantwortlich_email"};
const TEXT_COLS=["titel","beschreibung","email","standort","kategorie","kunde","verantwortlich"];
const SKIP=["id","nr","erstelltVon","erstellt","quelle","beispiel","geaendertAm"];
function fromDb(r){
  return {id:r.id,nr:r.nr,titel:r.titel,beschreibung:r.beschreibung,email:r.email,standort:r.standort,kategorie:r.kategorie,
    prioritaet:r.prioritaet,kunde:r.kunde,verantwortlich:r.verantwortlich,verantwortlichEmail:r.verantwortlich_email||"",status:r.status,eingang:r.eingang,start:r.start,
    erledigt:r.erledigt,faellig:r.faellig,planStd:r.plan_std==null?null:+r.plan_std,istStd:r.ist_std==null?null:+r.ist_std,
    wert:r.wert==null?null:+r.wert,verlauf:Array.isArray(r.verlauf)?r.verlauf:[],beispiel:!!r.beispiel,quelle:r.quelle,
    geaendertAm:r.geaendert_am,geaendertVon:r.geaendert_von,erstelltVon:r.email};
}
function toDb(p){
  const o={};
  Object.keys(p).forEach(k=>{ if(SKIP.includes(k)) return; let v=p[k]; if(TEXT_COLS.includes(k)&&v==null) v=""; o[MAP[k]||k]=v; });
  return o;
}
function upsertLocal(row){
  const t=fromDb(row); const i=S.tickets.findIndex(x=>x.id===t.id);
  if(i>=0) S.tickets[i]=t; else S.tickets.push(t);
}
async function writeDoc(id,data){
  const {data:rows,error}=await S.sb.from("auftraege").update(toDb(data)).eq("id",id).select();
  if(error) throw error;
  if(!rows||!rows.length) throw {code:"42501"};
  upsertLocal(rows[0]); afterData();
}
function errMsg(e){
  const c=e&&e.code, m=(e&&e.message)||"";
  if(c==="42501"||/row-level security|permission/i.test(m)) return "Keine Berechtigung. Bist du als Admin freigeschaltet?";
  if(c==="23514") return "Ein Wert ist ungültig (z. B. Text zu lang oder negative Zahl).";
  if(/JWT|session|expired/i.test(m)) return "Deine Anmeldung ist abgelaufen. Bitte neu anmelden.";
  if(/fetch|network/i.test(m)) return "Keine Verbindung. Prüfe das Internet und versuche es erneut.";
  if(/E-Mail|Zeichen|Aufträge/.test(m)) return m;
  return "Speichern fehlgeschlagen. Bitte erneut versuchen.";
}
async function quickNext(id){
  const t=S.tickets.find(x=>x.id===id); if(!t||!NEXT[t.status]) return;
  const st=NEXT[t.status];
  try{ await writeDoc(id,applyStatus(t,st,"")); toast(t.nr+" → "+ST[st].l); }
  catch(e){ toast(errMsg(e)); }
}
async function moveTo(id,st){
  const t=S.tickets.find(x=>x.id===id); if(!t||t.status===st) return;
  try{ await writeDoc(id,applyStatus(t,st,"")); toast(t.nr+" → "+ST[st].l); }
  catch(e){ toast(errMsg(e)); }
}

        upsertLocal(rows[0]);
        const extra={kunde:base.kunde,verantwortlich:base.verantwortlich,verantwortlichEmail:base.verantwortlichEmail,faellig:base.faellig,planStd:base.planStd,istStd:base.istStd,wert:base.wert};
        if(Math.abs(ts(o.orig.eingang)-ts(base.eingang))>=6e4) extra.eingang=base.eingang;
        if(o.status!=="eingang") Object.assign(extra,applyStatus(t,o.status,note));
        await writeDoc(t.id,extra);
      }
      toast(nr+" angelegt"); closeDrawer();
    } else {
      const t=S.tickets.find(x=>x.id===o.id);
      if(!t){ err.textContent="Dieser Auftrag wurde inzwischen von jemand anderem gelöscht."; btn.disabled=false; return; }
      // nur Felder schreiben, die in diesem Formular geändert wurden
      const patch={};
      Object.keys(base).forEach(k=>{
        const was=o.orig[k]==null||o.orig[k]===""?null:o.orig[k], now=base[k]==null||base[k]===""?null:base[k];
        if(k==="eingang"){ if(Math.abs(ts(o.orig.eingang)-ts(base.eingang))>=6e4) patch.eingang=base.eingang; return; }
        if(was!==now) patch[k]=base[k];
      });
      if(o.status!==t.status) Object.assign(patch,applyStatus(t,o.status,note));
      else if(note) Object.assign(patch,{verlauf:[...(t.verlauf||[]),{ts:new Date().toISOString(),status:t.status,notiz:note,von:S.me.id||null}]});
      if(!Object.keys(patch).length){ toast("Keine Änderungen"); closeDrawer(); return; }
      Object.assign(patch,stamp());
      await writeDoc(o.id,patch);
      toast(t.nr+" gespeichert"); closeDrawer();
    }
  }catch(e){ err.textContent=errMsg(e); btn.disabled=false; }
}

async function loadAll(){

    if(error) throw error;
    all.push(...data); if(data.length<1000) break; from+=1000;

}
function subscribe(){
  if(S.channel) S.sb.removeChannel(S.channel);
  S.channel=S.sb.channel("auftraege-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"auftraege"},p=>{
      if(p.eventType==="DELETE"){ const id=p.old&&p.old.id; S.tickets=S.tickets.filter(t=>t.id!==id); }
      else if(p.new) upsertLocal(p.new);
      afterData();
    })
    .subscribe(st=>{ const off=(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"); if(off!==!!S.offline){ S.offline=off; afterData(); } });
}

const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pushOk=()=>location.protocol==="https:"&&"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
if(location.protocol==="https:"&&"serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
function b64u(s){ const p="=".repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
function geraetName(){ const u=navigator.userAgent;
  const os=/iPhone/.test(u)?"iPhone":/iPad/.test(u)||isIOS?"iPad":/Android/.test(u)?"Android":/Windows/.test(u)?"Windows":/Mac/.test(u)?"Mac":"Gerät";
  const br=/Edg\//.test(u)?"Edge":/Firefox\//.test(u)?"Firefox":/Chrome\//.test(u)?"Chrome":/Safari\//.test(u)?"Safari":"Browser";
  return os+" · "+br; }
async function currentSub(){ if(!pushOk()) return null; const reg=await navigator.serviceWorker.getRegistration(); return reg?reg.pushManager.getSubscription():null; }
async function pushEnable(){
  const perm=await Notification.requestPermission();
  if(perm!=="granted") throw new Error(perm==="denied"?"blockiert":"abgebrochen");
  const reg=await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
  let {data:key}=await S.sb.rpc("push_schluessel");
  if(!key){
    const r=await fetch(SUPABASE_URL+"/functions/v1/benachrichtigen",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY},body:"{}"});
    key=(await r.json()).publicKey;
  }
  if(!key) throw new Error("schluessel");
  let sub=await reg.pushManager.getSubscription();
  if(sub){ try{ await sub.unsubscribe(); }catch(_){} }
  sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
  const j=sub.toJSON();
  const {error}=await S.sb.rpc("push_abo_speichern",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_geraet:geraetName()});
  if(error) throw error;
}
async function pushDisable(){
  const sub=await currentSub(); if(!sub) return;
  try{ await S.sb.rpc("push_abo_entfernen",{p_endpoint:sub.endpoint}); }catch(_){}
  await sub.unsubscribe();
}
async function openPush(){
  const sub=await currentSub().catch(()=>null);
  const {data:abos}=await S.sb.from("push_abos").select("geraet,angelegt_am").order("angelegt_am");
  const on=!!sub;
  let geraet;
  if(location.protocol!=="https:"){
    const url=APP_URL&&!/__APP_URL__/.test(APP_URL)?APP_URL+"admin.html":"";
    geraet='<p class="pinfo">Push-Mitteilungen gehen nur, wenn das Auftragsbuch über die Web-Adresse geöffnet wird'+(url?': <a href="'+esc(url)+'">'+esc(url)+'</a>':'')+'. Dort hier erneut auf „Mitteilungen“ klicken.</p>';
  } else if(isIOS&&!isStandalone){
    geraet='<p class="pinfo">Auf iPhone und iPad gehen Push-Mitteilungen nur über das Symbol auf dem Home-Bildschirm: In Safari unten auf <b>Teilen</b> tippen → <b>Zum Home-Bildschirm</b>. Dann das Auftragsbuch über das neue Symbol öffnen, anmelden und hier aktivieren.</p>';
  } else if(!pushOk()){
    geraet='<p class="pinfo">Dieser Browser unterstützt keine Push-Mitteilungen. Bitte Chrome, Edge, Firefox oder Safari verwenden.</p>';
  } else if(Notification.permission==="denied"){
    geraet='<p class="pinfo">Mitteilungen sind für diese Seite im Browser blockiert. Bitte in den Website-Einstellungen des Browsers (Schloss-Symbol neben der Adresse) „Benachrichtigungen: Zulassen“ wählen und die Seite neu laden.</p>';
  } else {
    geraet='<div class="row2" style="justify-content:flex-start"><button class="btn '+(on?'':'primary')+'" type="button" id="pToggle">'+(on?'Auf diesem Gerät ausschalten':'Auf diesem Gerät aktivieren')+'</button></div>';
  }
  const d=dlg('<h2 id="dlgT">Mitteilungen</h2>'+
    '<p>Bei jedem neuen Auftrag und wenn dir ein Auftrag zugewiesen wird – auch wenn das Auftragsbuch geschlossen ist.</p>'+
    '<div class="pstate'+(on?' on':'')+'"><span class="dot"></span>Push auf diesem Gerät: '+(on?'aktiv':'aus')+'</div>'+geraet+
    '<p class="pinfo">Aktive Geräte: '+(abos&&abos.length?abos.map(a=>esc(a.geraet||"Gerät")).join(", "):'keine')+'</p>'+
    '<label class="chk"><input type="checkbox" id="pMail"'+(S.me.mailNeu?' checked':'')+'> Bei neuen Aufträgen zusätzlich eine E-Mail an mich</label>'+
    '<p class="pinfo">Zugewiesene Aufträge kommen immer per E-Mail.</p>'+
    '<div class="err" id="pErr" role="alert"></div>'+
    '<div class="row2"><button class="btn" type="button" id="pTest">Test senden</button><button class="btn" type="button" data-dlgclose>Schließen</button></div>');
  const tg=d.querySelector("#pToggle");
  if(tg) tg.addEventListener("click",async()=>{
    tg.disabled=true; $("#pErr").textContent="";
    try{ if(on){ await pushDisable(); toast("Push auf diesem Gerät ausgeschaltet"); } else { await pushEnable(); toast("Push auf diesem Gerät aktiviert"); } openPush(); }
    catch(e){ tg.disabled=false; const m=(e&&e.message)||"";
      $("#pErr").textContent=m==="blockiert"?"Mitteilungen wurden im Browser abgelehnt.":m==="abgebrochen"?"Bitte die Nachfrage des Browsers mit „Erlauben“ bestätigen.":"Aktivieren hat nicht geklappt. Bitte später erneut versuchen."; }
  });
  d.querySelector("#pMail").addEventListener("change",async e=>{
    const v=e.target.checked; const {error}=await S.sb.rpc("mail_bei_neu_setzen",{p_an:v});
    if(error){ e.target.checked=!v; $("#pErr").textContent=errMsg(error); return; }
    S.me.mailNeu=v; toast(v?"E-Mail bei neuen Aufträgen: an":"E-Mail bei neuen Aufträgen: aus");
  });
  d.querySelector("#pTest").addEventListener("click",async e=>{
    e.target.disabled=true; const {error}=await S.sb.rpc("test_benachrichtigung");
    if(error){ e.target.disabled=false; $("#pErr").textContent=/warten/.test(error.message||"")?error.message:errMsg(error); return; }
    toast("Test verschickt – kommt in wenigen Sekunden");
  });
}
$("#btnPush").addEventListener("click",()=>openPush().catch(e=>toast(errMsg(e))));
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#dlgRoot")) closeDlg(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const r=$("#pwRoot"); if(r&&!r.dataset.forced) closePw(); } });
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!S.sb){ $("#lErr").textContent="Die App ist noch nicht mit der Datenbank verbunden."; return; }
  const b=$("#lBtn"); b.disabled=true; $("#lErr").textContent="";
  const {data,error}=await S.sb.auth.signInWithPassword({email:$("#lEmail").value.trim(),password:$("#lPass").value});
  b.disabled=false;
  if(error){ $("#lErr").textContent=/Invalid login/i.test(error.message)?"E-Mail oder Passwort ist falsch.":errMsg(error); return; }
  $("#lPass").value="";
  enterApp(data.session);
});
$("#btnLogout").addEventListener("click",async()=>{ if(S.channel) S.sb.removeChannel(S.channel); S.channel=null; await S.sb.auth.signOut(); S.tickets=[]; S.loaded=false; showLogin("Du bist abgemeldet."); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.loaded&&S.sb&&!$("#appView").hidden){ loadAll().catch(()=>{}); if(S.offline) subscribe(); } });

(async function boot(){
  const ok=/^https:\/\//.test(SUPABASE_URL)&&SUPABASE_KEY&&!/HIER_/.test(SUPABASE_KEY);
  if(!ok||!window.supabase){ $("#setupNote").hidden=false; showLogin(window.supabase?"":"Die Supabase-Bibliothek konnte nicht geladen werden. Internetverbindung prüfen."); return; }
  S.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data}=await S.sb.auth.getSession();
  if(data&&data.session) enterApp(data.session); else showLogin();
})();
})();
</script>
</body>
</html>
